<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galicia & Portugal - Jacob Davis</title>
  <meta name="description" content="Galicia & Portugal, a photographic collection by Jacob Davis.">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Responsive Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      align-items: start;
    }

    .photo {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    /* Base Container (Landscape default) */
    .photo-wrapper {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Container adjusts to portrait orientation when rotated 90 or 270 deg */
    .photo-wrapper.is-portrait {
      aspect-ratio: 3 / 4;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    /* Pure rotation without artificial scaling/cropping */
    .rotate-90  { transform: rotate(90deg); }
    .rotate-180 { transform: rotate(180deg); }
    .rotate-270 { transform: rotate(270deg); }

    /* CSS Magic: Swaps rendering dimensions so 90/270 deg images fit the vertical frame */
    .photo-wrapper.is-portrait img {
      width: 133.33%;  /* (4 / 3) * 100% */
      height: 75%;     /* (3 / 4) * 100% */
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="index.html" aria-label="Jacob Davis - Home">
      <span>Jacob Davis</span>
      <span class="site-title-divider" aria-hidden="true"></span>
      <span class="site-title-section">Photographs</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Collections</a>
      <a href="index.html#about">About</a>
    </nav>
  </header>

  <main>
    <article class="album">
      <header class="album-header">
        <a class="back-link" href="index.html">&larr; All collections</a>
        <div class="album-heading">
          <div>
            <p class="eyebrow">Collection 02</p>
            <h1>Galicia & Portugal</h1>
          </div>
          <dl class="album-metadata">
            <div>
              <dt>Date</dt>
              <dd>2026</dd>
            </div>
            <div>
              <dt>Location</dt>
              <dd>Galicia & Portugal</dd>
            </div>
          </dl>
        </div>
        <p class="album-description">
          A dynamic visual diary loaded directly from the repository.
        </p>
      </header>

      <div id="photo-grid" class="photo-grid">
        <p id="loading-text">Loading gallery...</p>
      </div>

      <nav class="album-navigation" aria-label="Collection navigation">
        <a href="index.html">
          <span class="nav-label">Index</span>
          <span>All collections</span>
        </a>
      </nav>
    </article>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year">2026</span> Jacob Davis</p>
    <a href="#top">Back to top &uarr;</a>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const GITHUB_USERNAME = "JacobDavis1995";
    const GITHUB_REPO = "Jacob-Davis-Photographs";
    const FOLDER_PATH = "Galicia";
    const BRANCH = "main";

    // --- PER-IMAGE ROTATION CONFIGURATION ---
    // Specify exact file names and desired rotation angle (90, 180, 270)
    const ROTATIONS = {
      "photo-01.jpg": 90,
      "coastal-view.jpg": 270,
      "old-town.png": 180
    };

    const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;
    const photoGrid = document.getElementById("photo-grid");

    async function loadGallery() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("Unable to fetch repository files.");
        
        const files = await response.json();
        
        const imageExtensions = [".jpg", ".jpeg", ".png", ".webp", ".gif"];
        const imageFiles = files.filter(file => 
          imageExtensions.some(ext => file.name.toLowerCase().endsWith(ext))
        );

        if (imageFiles.length === 0) {
          photoGrid.innerHTML = "<p>No images found in the specified directory.</p>";
          return;
        }

        photoGrid.innerHTML = "";

        imageFiles.forEach((file) => {
          const rawImageUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/${BRANCH}/${FOLDER_PATH}/${file.name}`;
          const rotationAngle = ROTATIONS[file.name] || 0;
          
          // Check if rotation turns a landscape photo into portrait orientation
          const isPortraitRotation = rotationAngle === 90 || rotationAngle === 270;
          const wrapperClass = isPortraitRotation ? "photo-wrapper is-portrait" : "photo-wrapper";
          const rotationClass = rotationAngle ? `rotate-${rotationAngle}` : "";
          
          const figure = document.createElement("figure");
          figure.className = "photo";
          
          figure.innerHTML = `
            <div class="${wrapperClass}">
              <img src="${rawImageUrl}" alt="Photographic work" class="${rotationClass}" loading="lazy">
            </div>
          `;

          photoGrid.appendChild(figure);
        });
      } catch (error) {
        photoGrid.innerHTML = `<p>Error loading photos: ${error.message}</p>`;
      }
    }

    loadGallery();
  </script>
</body>
</html>
